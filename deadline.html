<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>처리기한 계산 · 복지업무 도우미</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main>
  <div class="page-head">
    <h1>처리기한 계산</h1>
    <p>신청일·통지일을 넣으면 법정 처리기한과 불복 기한을 공휴일까지 반영해 계산합니다.</p>
  </div>

  <div class="grid grid-2">
    <div class="card">
      <h2>기한 계산</h2>
      <div class="field"><label for="rule">기한 종류</label><select id="rule"></select></div>
      <div id="custom" hidden>
        <div class="grid" style="grid-template-columns:1fr 1fr">
          <div class="field"><label for="n">기간</label><input type="number" id="n" min="1" value="14"></div>
          <div class="field"><label for="unit">단위</label>
            <select id="unit"><option value="day">일 (달력)</option><option value="bizday">근무일</option><option value="month">개월</option></select></div>
        </div>
      </div>
      <div class="field"><label for="base" id="baseLabel">기준일</label><input type="date" id="base"></div>
      <label class="check" style="margin-bottom:6px"><input type="checkbox" id="excludeFirst" checked> 첫날 빼고 계산 (초일 불산입)</label>
      <label class="check"><input type="checkbox" id="rollOver" checked> 마지막 날이 토요일·공휴일이면 다음 근무일로</label>
      <p class="muted" style="font-size:.84rem;margin-top:10px">기간 계산은 행정기본법 제6조·민법 제157조, 제161조를 따릅니다. 국민의 권익을 제한하는 기간 등 예외가 있을 수 있습니다.</p>
    </div>

    <div class="card">
      <h2>결과</h2>
      <div id="result"></div>
    </div>
  </div>

  <div class="card">
    <div class="row"><h2 style="margin:0">같은 기준일로 본 전체 기한</h2><span class="spacer"></span><button class="btn sm" id="copyAll">표 복사</button></div>
    <div class="table-wrap" style="margin-top:10px" id="all"></div>
  </div>

  <div class="card">
    <h2>두 날짜 사이 근무일 수</h2>
    <div class="row">
      <input type="date" id="from" style="max-width:180px"> ~ <input type="date" id="to" style="max-width:180px">
      <span id="between" style="margin-left:8px"></span>
    </div>
  </div>
</main>

<script src="assets/common.js"></script>
<script src="assets/data.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const H = WELFARE_DATA.holidays;
const RULES = WELFARE_DATA.deadlines.concat([{ id: "custom", name: "직접 입력", base: "기준일", n: 14, unit: "day", law: "", note: "" }]);
$("rule").innerHTML = RULES.map((r) => `<option value="${r.id}">${r.name}</option>`).join("");

const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const isOff = (d) => d.getDay() === 0 || d.getDay() === 6 || !!H[App.ymd(d)];
const WEEK = "일월화수목금토";
const fmt = (d) => `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.(${WEEK[d.getDay()]})`;

function addMonths(d, n) {
  const target = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
  return new Date(target.getFullYear(), target.getMonth(), Math.min(d.getDate(), last));
}

// 기준일과 규칙으로 만료일 계산. 반환: { end, rolled }
function compute(base, n, unit) {
  const exclude = $("excludeFirst").checked;
  let end;
  if (unit === "bizday") {
    end = exclude ? base : addDays(base, -1);
    let left = n;
    while (left > 0) { end = addDays(end, 1); if (!isOff(end)) left--; }
    return { end, rolled: null };
  }
  if (unit === "month") end = exclude ? addMonths(base, n) : addDays(addMonths(base, n), -1);
  else end = addDays(base, exclude ? n : n - 1);
  let rolled = null;
  if ($("rollOver").checked && isOff(end)) {
    rolled = end;
    while (isOff(end)) end = addDays(end, 1);
  }
  return { end, rolled };
}

function dday(end) {
  const today = parse(App.ymd(new Date()));
  const diff = Math.round((end - today) / 86400000);
  if (diff === 0) return '<span class="badge warn">오늘 만료</span>';
  if (diff < 0) return `<span class="badge bad">${-diff}일 지남</span>`;
  return `<span class="badge ${diff <= 7 ? "warn" : "ok"}">D-${diff}</span>`;
}

const unitText = (r) => `${r.n}${{ day: "일", bizday: "근무일", month: "개월" }[r.unit]}`;

function current() {
  const r = { ...RULES.find((x) => x.id === $("rule").value) };
  if (r.id === "custom") { r.n = Number($("n").value) || 1; r.unit = $("unit").value; }
  return r;
}

function render() {
  const r = current();
  $("custom").hidden = r.id !== "custom";
  $("baseLabel").textContent = r.base;
  if (!$("base").value) { $("result").innerHTML = '<p class="muted">기준일을 입력하세요.</p>'; $("all").innerHTML = ""; return; }
  const base = parse($("base").value);
  const { end, rolled } = compute(base, r.n, r.unit);
  $("result").innerHTML = `
    <small>${r.base} ${fmt(base)}부터 ${unitText(r)}</small>
    <div class="row" style="margin:4px 0 8px"><span class="big-num">${fmt(end)}</span>${dday(end)}</div>
    ${rolled ? `<p class="muted" style="font-size:.88rem">원래 만료일 ${fmt(rolled)}이(가) ${H[App.ymd(rolled)] || "주말"}이라 다음 근무일로 넘겼습니다.</p>` : ""}
    ${r.law ? `<p style="margin:0"><span class="badge primary">${r.law}</span></p>` : ""}
    ${r.note ? `<p class="muted" style="font-size:.88rem;margin-top:8px">${r.note}</p>` : ""}
    <button class="btn sm" id="copyOne" style="margin-top:8px">결과 복사</button>`;
  $("copyOne").onclick = () => App.copy(`${r.name}: ${r.base} ${fmt(base)} → 만료 ${fmt(end)} (${unitText(r)}${r.law ? ", " + r.law : ""})`);

  $("all").innerHTML = `<table><thead><tr><th>기한</th><th>기준</th><th class="num">기간</th><th>만료일</th><th></th><th>근거</th></tr></thead><tbody>
    ${WELFARE_DATA.deadlines.map((x) => { const e = compute(base, x.n, x.unit).end;
      return `<tr><td>${x.name}</td><td>${x.base}</td><td class="num">${unitText(x)}</td><td>${fmt(e)}</td><td>${dday(e)}</td><td><small>${x.law}</small></td></tr>`; }).join("")}
  </tbody></table>`;
}

$("copyAll").addEventListener("click", () => {
  if (!$("base").value) return;
  const base = parse($("base").value);
  App.copy([`기준일 ${fmt(base)}`].concat(WELFARE_DATA.deadlines.map((x) =>
    `- ${x.name} (${x.base}부터 ${unitText(x)}): ${fmt(compute(base, x.n, x.unit).end)}`)).join("\n"));
});

function between() {
  if (!$("from").value || !$("to").value) { $("between").textContent = ""; return; }
  let a = parse($("from").value), b = parse($("to").value);
  if (a > b) [a, b] = [b, a];
  let biz = 0, cal = 0;
  for (let d = a; d <= b; d = addDays(d, 1)) { cal++; if (!isOff(d)) biz++; }
  $("between").innerHTML = `<b>근무일 ${biz}일</b> <span class="muted">(달력 ${cal}일, 양 끝 포함)</span>`;
}

["rule", "n", "unit", "base", "excludeFirst", "rollOver"].forEach((id) => $(id).addEventListener("input", render));
["from", "to"].forEach((id) => $(id).addEventListener("input", between));
$("base").value = App.ymd(new Date());
render();
</script>
</body>
</html>
