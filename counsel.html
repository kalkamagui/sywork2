<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상담기록 작성 · 복지업무 도우미</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main>
  <div class="page-head">
    <h1>상담기록 작성</h1>
    <p>초기상담 항목을 채우면 행복이음 상담내역에 붙여넣을 문장으로 정리합니다.</p>
  </div>

  <div class="notice info">입력 내용은 저장되지 않으며 창을 닫으면 사라집니다. 성명·주민번호 등 식별정보는 시스템에서 직접 입력하고, 여기에는 이니셜이나 가구 특성만 적는 것을 권장합니다.</div>

  <div class="grid grid-2">
    <form class="card" id="form">
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <div class="field"><label for="date">상담일</label><input type="date" id="date"></div>
        <div class="field"><label for="method">상담 방법</label>
          <select id="method"><option>내방</option><option>전화</option><option>가정방문</option><option>온라인</option><option>기관 의뢰</option></select></div>
        <div class="field"><label for="route">발굴·접수 경로</label>
          <select id="route"><option>본인 신청</option><option>가족·이웃 신고</option><option>위기가구 발굴 시스템</option><option>명예사회복지공무원</option><option>유관기관 의뢰</option><option>통·반장</option><option>기타</option></select></div>
        <div class="field"><label for="household">가구 유형</label>
          <select id="household"><option>1인 가구</option><option>노인 가구</option><option>장애인 가구</option><option>한부모 가구</option><option>조손 가구</option><option>다문화 가구</option><option>일반 가구</option></select></div>
      </div>
      <div class="field"><label for="client">대상자 (이니셜·연령대 등)</label><input type="text" id="client" placeholder="예: 김○○, 70대 남성, 독거"></div>

      <div class="field">
        <label>위기 사유</label>
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px" id="crisis"></div>
      </div>

      <div class="field"><label for="complaint">주호소 (대상자 진술)</label><textarea id="complaint" placeholder="대상자가 말한 어려움을 요약"></textarea></div>
      <div class="field"><label for="situation">파악된 상황 (소득·주거·건강·관계)</label><textarea id="situation"></textarea></div>
      <div class="field">
        <label>안내·제공 서비스</label>
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px" id="services"></div>
      </div>
      <div class="field"><label for="linked">연계 기관·내용</label><input type="text" id="linked" placeholder="예: 정신건강복지센터 상담 연계, 푸드뱅크 의뢰"></div>
      <div class="field"><label for="opinion">담당자 의견</label><textarea id="opinion"></textarea></div>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <div class="field"><label for="plan">향후 계획</label><input type="text" id="plan" placeholder="예: 서류 보완 후 신청 접수"></div>
        <div class="field"><label for="follow">사후관리 예정일</label><input type="date" id="follow"></div>
      </div>
      <button class="btn" type="reset">모두 지우기</button>
    </form>

    <div>
      <div class="card" style="position:sticky;top:72px">
        <div class="row" style="margin-bottom:8px">
          <h2 style="margin:0">정리된 상담내용</h2><span class="spacer"></span>
          <select id="style" style="width:auto"><option value="list">항목형</option><option value="prose">서술형</option></select>
          <button class="btn primary" id="copy">복사</button>
        </div>
        <div class="output" id="out"></div>
        <small class="muted" id="len"></small>
      </div>
    </div>
  </div>
</main>

<script src="assets/common.js"></script>
<script>
const CRISIS = ["실직·휴폐업", "소득 감소", "주 소득자 사망·이탈", "질병·부상", "의료비 부담", "주거 위기(체납·퇴거)",
  "단전·단수·가스 중단", "공과금 체납", "채무", "고립·은둔", "가정폭력·학대", "돌봄 공백", "정신건강", "자살 위험", "식사 해결 곤란"];
const SERVICES = ["기초생활보장", "긴급지원", "기초연금", "차상위", "주거급여", "의료급여", "장애인 서비스", "한부모 지원",
  "노인맞춤돌봄", "자활사업", "바우처", "민간자원(후원·푸드뱅크)", "통합사례관리", "정보 제공만"];
const $ = (id) => document.getElementById(id);
const boxes = (list, name) => list.map((t) => `<label class="check" style="font-size:.9rem"><input type="checkbox" name="${name}" value="${t}"> ${t}</label>`).join("");
$("crisis").innerHTML = boxes(CRISIS, "crisis");
$("services").innerHTML = boxes(SERVICES, "services");
$("date").value = App.ymd(new Date());

const val = (id) => $(id).value.trim();
const picked = (name) => [...document.querySelectorAll(`input[name=${name}]:checked`)].map((i) => i.value);
const dot = (s) => s.replace(/\.?$/, ".");

function build() {
  const crisis = picked("crisis"), services = picked("services");
  if ($("style").value === "list") {
    const lines = [
      `[상담일시] ${val("date")} / ${val("method")}`,
      `[접수경로] ${val("route")}`,
      `[대상자] ${[val("client"), val("household")].filter(Boolean).join(", ")}`,
      crisis.length && `[위기사유] ${crisis.join(", ")}`,
      val("complaint") && `[주호소] ${val("complaint")}`,
      val("situation") && `[상황] ${val("situation")}`,
      services.length && `[안내·제공] ${services.join(", ")}`,
      val("linked") && `[연계] ${val("linked")}`,
      val("opinion") && `[담당자 의견] ${val("opinion")}`,
      val("plan") && `[향후계획] ${val("plan")}`,
      val("follow") && `[사후관리] ${val("follow")} 예정`,
    ];
    return lines.filter(Boolean).join("\n");
  }
  const s = [];
  s.push(`${val("date")} ${val("method")} 상담 (${val("route")}).`);
  if (val("client") || val("household")) s.push(`대상자는 ${[val("client"), val("household")].filter(Boolean).join(", ")}임.`);
  if (crisis.length) s.push(`${crisis.join(", ")} 등의 위기 상황이 확인됨.`);
  if (val("complaint")) s.push(`대상자는 "${val("complaint")}"라고 호소함.`);
  if (val("situation")) s.push(dot(val("situation")));
  if (services.length) s.push(`${services.join(", ")}에 대해 안내함.`);
  if (val("linked")) s.push(`${val("linked")} 진행함.`);
  if (val("opinion")) s.push(`(담당자 의견) ${dot(val("opinion"))}`);
  if (val("plan")) s.push(`향후 ${dot(val("plan"))}`);
  if (val("follow")) s.push(`${val("follow")} 사후관리 예정.`);
  return s.join(" ");
}

function render() {
  const text = build();
  $("out").textContent = text;
  $("len").textContent = `${text.length}자`;
}
$("form").addEventListener("input", render);
$("form").addEventListener("reset", () => setTimeout(() => { $("date").value = App.ymd(new Date()); render(); }));
$("style").addEventListener("change", render);
$("copy").addEventListener("click", () => App.copy(build()));
render();
</script>
</body>
</html>
